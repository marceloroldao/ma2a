[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ma2a-reference"
version = "0.1.0.dev0"
description = "Experimental MA2A reference implementation"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "reference/python"}

[tool.setuptools.packages.find]
where = ["reference/python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
