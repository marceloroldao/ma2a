name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - bootstrap/**

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q

  cpp-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install cross-language test dependency
        run: python -m pip install cryptography
      - name: Checkout resolutive-routing integration dependency
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/resolutive-routing
          ref: 17bf787d92589ad398bf9f65c1eecbbbbde8f6b1
          path: resolutive-routing
      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DRESOLUTIVE_ROUTING_SOURCE_DIR="$GITHUB_WORKSPACE/resolutive-routing"
      - name: Build
        run: cmake --build cpp/build --config Release --parallel
      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure
      - name: Benchmark resilient execution
        run: |
          set -o pipefail
          ./cpp/build/ma2a_resilient_execution_stress_test | tee cpp/build/resilient_execution_benchmark.json
      - name: Upload resilient execution benchmark
        uses: actions/upload-artifact@v4
        with:
          name: resilient-execution-benchmark
          path: cpp/build/resilient_execution_benchmark.json
          if-no-files-found: error
